# OTA yayınını GitHub Actions üzerinden yapar.
#
# NEDEN: yayın komutunun çalıştığı yerin api.expo.dev'e çıkabilmesi gerekiyor.
# Geliştirme oturumunun ağ politikası o host'u kapatıyor; Actions runner'ında
# böyle bir kısıt yok. Ayrıca token depoda secret olarak duruyor — kimsenin
# makinesinde ya da sohbetinde değil.
#
# Yayından ÖNCE tip kontrolü ve testler koşuyor: kullanıcının telefonuna
# derlenmeyen ya da testi kırık bir bundle gitmesin.
name: EAS Update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update branch (kanal)'
        required: false
        default: production
      message:
        description: 'Yayın notu'
        required: false
      platform:
        description: 'Yayınlanacak platform(lar)'
        required: false
        default: ios
        type: choice
        options:
          - ios
          - android
          - all
  push:
    # Düzeltme henüz main'de değil; OTA'nın bu daldan çıkması bilinçli.
    # main'e birleştikten sonra bu tetikleyici kaldırılmalı, yayın yalnızca
    # elle (workflow_dispatch) yapılmalı.
    branches:
      - claude/testflight-crash-analysis-8hbzpb

# İki yayın aynı anda çıkmasın.
concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Token var mi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret'i tanimli degil."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - run: npm ci

      - name: Tip kontrolu
        run: npx tsc --noEmit

      - name: Testler
        # tests/ dizini .gitignore'da (ilk commit'ten beri, CLAUDE.md ve
        # NOTES.md ile aynı blokta), yani depoda test dosyası olmayabilir.
        # Varsa koşsun ve yayını durdursun; yoksa runner'da olmayan bir
        # dosya yüzünden OTA tıkanmasın. Asıl kapı tip kontrolü.
        run: npm test -- --passWithNoTests

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: OTA yayini
        env:
          # Kabuğa doğrudan gömmek yerine ortam değişkeni: girdi metni
          # komutu bozamasın.
          EAS_BRANCH: ${{ github.event.inputs.branch || 'production' }}
          EAS_MESSAGE: ${{ github.event.inputs.message || format('{0} @ {1}', github.ref_name, github.sha) }}
          # Yalnızca iOS. `eas update` varsayılanı "all" ve web bundle'ı bu
          # projede DERLENMİYOR: expo-sqlite'ın web tarafı
          # ./wa-sqlite/wa-sqlite.wasm dosyasını import ediyor, dosya
          # pakette yok (yerelde de aynı hata). Dağıtılan tek hedef iOS
          # olduğu için web'i export etmeye çalışmak yayını boşuna
          # düşürüyordu.
          EAS_PLATFORM: ${{ github.event.inputs.platform || 'ios' }}
        # --non-interactive artık desteklenmiyor; CI ortamında CI=1 zaten set.
        run: eas update --branch "$EAS_BRANCH" --platform "$EAS_PLATFORM" --message "$EAS_MESSAGE"

  # ---------------------------------------------------------------------------
  # Native derleme (yalnızca istendiğinde)
  # ---------------------------------------------------------------------------
  #
  # Commit mesajında [build] geçince koşuyor. Neden böyle: workflow_dispatch
  # dosyanın VARSAYILAN DALDA olmasını şart koşuyor, bu iş ise henüz main'e
  # birleşmedi ve izinsiz main'e push edilmez. İşaretçi, her push'ta derleme
  # başlatmadan istendiğinde başlatmanın en basit yolu.
  #
  # Derleme EAS sunucularında koşuyor; runner yalnızca işi kuyruğa atıyor,
  # o yüzden --no-wait ile 30 dakika runner tutulmuyor.
  build:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip kontrolu
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --auto-submit: derleme bitince App Store Connect'e yükler (TestFlight).
      # Bu, "inceleme için gönder" DEĞİLDİR — o adım App Store Connect'te
      # ekran görüntüleri ve inceleme notlarıyla birlikte elle yapılır.
      - name: iOS derlemesi
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
